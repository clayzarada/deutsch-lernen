# Builds everything a release offers and attaches it, once the tests pass. Publishing a release (on GitHub or with
# `gh release create vX.Y.Z --title ... --notes ...`, no files needed) starts it. About 10 minutes for the Windows
# app and the Mac zip; the Intel Mac app can take half an hour when GitHub is busy.
#   Deutsch-lernen-Windows.zip          the Windows app ("Update now" on Windows downloads this)
#   Deutsch-lernen-Mac.zip              the Mac installer kit (build_mac.command), for first installs
#   Deutsch-lernen-Mac-app-<arch>.zip   the ready-made Mac app ("Update now" on a Mac downloads this)
# If anything fails, nothing is half-attached: run it again from the Actions tab with the tag ("Run workflow").
name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (e.g. v2.0.4)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  APP_NAME: Deutsch lernen

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The release's version matches its tag
        shell: bash
        run: |
          v=$(python -c "import json;print(json.load(open('version.json'))['version'])")
          [ "v$v" = "$TAG" ] || { echo "version.json says $v but the release is $TAG"; exit 1; }
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests
      - name: The version stamp was up to date (otherwise the builds would number themselves one higher)
        shell: bash
        run: git diff --exit-code version.json

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the Windows app
        env:
          PACKAGE_OUT_DIR: ${{ runner.temp }}
        run: python make_windows_package.py
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/Deutsch-lernen-Windows.zip" --clobber

  mac-kit:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Make the Mac installer kit (no keys, no data)
        env:
          PACKAGE_OUT_DIR: ${{ runner.temp }}
        run: python make_mac_package.py
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/Deutsch-lernen-Mac.zip" --clobber

  mac-app:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the app's packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller "pywebview>=5"

      - name: Make the icon
        run: |
          mkdir -p build/icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s static/icon.png --out "build/icon.iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2)); [ $d -gt 512 ] && d=512
            sips -z $d $d static/icon.png --out "build/icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns build/icon.iconset -o build/icon.icns

      # Keep these flags the same as in build_mac.command.
      - name: Build the app
        run: |
          pyinstaller --noconfirm --clean --log-level WARN --windowed \
            --name "$APP_NAME" --icon build/icon.icns --osx-bundle-identifier local.deutsch-lernen \
            --add-data "static:static" --add-data "version.json:." \
            --hidden-import app.main --collect-submodules app \
            --collect-submodules uvicorn --collect-all webview --collect-data genanki \
            launch_mac.py
          test -d "dist/$APP_NAME.app"

      - name: Check it starts and reports the release's version
        run: |
          APP_BIN="dist/$APP_NAME.app/Contents/MacOS/$APP_NAME"
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          touch_dir="$HOME/Library/Application Support/$APP_NAME"; mkdir -p "$touch_dir"; touch "$touch_dir/use-browser"
          "$APP_BIN" & PID=$!
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8777/api/version && break; sleep 1; done
          curl -sf http://127.0.0.1:8777/api/version | grep -q "\"${TAG#v}\""
          kill $PID || true

      - name: Zip and attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ditto -c -k --keepParent "dist/$APP_NAME.app" "Deutsch-lernen-Mac-app-${{ matrix.arch }}.zip"
          gh release upload "$TAG" "Deutsch-lernen-Mac-app-${{ matrix.arch }}.zip" --clobber
