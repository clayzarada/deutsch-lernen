# Builds the ready-made Mac app for every release and attaches it to the release, so Mac copies can update themselves
# ("Update now" downloads Deutsch-lernen-Mac-app-<arch>.zip; see app/update.py). Runs on GitHub's own Macs: one Apple
# Silicon build and one Intel build. The steps match build_mac.command (keep the pyinstaller flags in sync), minus
# installing: no keys, no data, just the app.
name: Mac app

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (e.g. v2.0.3)
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      APP_NAME: Deutsch lernen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the app's packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller "pywebview>=5"

      - name: Make the icon
        run: |
          mkdir -p build/icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s static/icon.png --out "build/icon.iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2)); [ $d -gt 512 ] && d=512
            sips -z $d $d static/icon.png --out "build/icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns build/icon.iconset -o build/icon.icns

      - name: Build the app
        run: |
          pyinstaller --noconfirm --clean --log-level WARN --windowed \
            --name "$APP_NAME" --icon build/icon.icns --osx-bundle-identifier local.deutsch-lernen \
            --add-data "static:static" --add-data "version.json:." \
            --hidden-import app.main --collect-submodules app \
            --collect-submodules uvicorn --collect-all webview --collect-data genanki \
            launch_mac.py
          test -d "dist/$APP_NAME.app"

      - name: Check it starts and reports the release's version
        run: |
          APP_BIN="dist/$APP_NAME.app/Contents/MacOS/$APP_NAME"
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          touch_dir="$HOME/Library/Application Support/$APP_NAME"; mkdir -p "$touch_dir"; touch "$touch_dir/use-browser"
          "$APP_BIN" & PID=$!
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8777/api/version && break; sleep 1; done
          curl -sf http://127.0.0.1:8777/api/version | grep -q "\"$(python -c 'import json;print(json.load(open("version.json"))["version"])')\""
          kill $PID || true

      - name: Zip and attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ditto -c -k --keepParent "dist/$APP_NAME.app" "Deutsch-lernen-Mac-app-${{ matrix.arch }}.zip"
          gh release upload "$TAG" "Deutsch-lernen-Mac-app-${{ matrix.arch }}.zip" --clobber
