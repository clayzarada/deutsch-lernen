# Runs the checks in tests/ on every change pushed to GitHub, on Windows and on a Mac.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests
      - name: The page scripts have no syntax errors
        shell: bash
        run: for f in static/js/*.js static/i18n/*.js; do node --check "$f" || exit 1; done
